name: Validate PowerLab
on:
  push:
    branches: [main, 'feat/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - run: node scripts/offline-smoke.mjs
      - run: POWERLAB_BASE_PATH=/AdigunPowerLab/ node scripts/offline-smoke.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: AdigunPowerLab
          path: dist
